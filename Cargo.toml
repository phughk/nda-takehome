[package]
name = "nda-takehome"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"

[features]
metrics_stdout = ["opentelemetry-stdout", "opentelemetry_sdk"]

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.60", features = ["derive"] }
csv = "1.4.0"
csv-async = { version = "1.3.1", features = ["tokio", "tokio-stream", "serde"] }
dashmap = "6.1.0"
futures = "0.3.32"
lazy_static = "1.5.0"
num-bigint = { version = "0.4.6", features = ["serde"] }
opentelemetry = "0.31.0"
opentelemetry-stdout = { version = "0.31.0", optional = true }
opentelemetry_sdk = { version = "0.31.0", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["full"] }
tokio-stream = { version = "0.1.18", features = ["fs"] }
tokio-util = "0.7.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[dev-dependencies]
proptest = "1.6"
tempfile = "3.27.0"
tokio-test = "0.4"
